name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NUXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NUXT_PUBLIC_FIREBASE_API_KEY }}
  NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
  NUXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NUXT_PUBLIC_FIREBASE_PROJECT_ID }}
  NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
  NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
  NUXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NUXT_PUBLIC_FIREBASE_APP_ID }}

permissions:
  checks: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build Nuxt app
        working-directory: app
        run: npm run generate

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
          target: ${{ secrets.FIREBASE_HOSTING_SITE }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install firebase-tools
        run: npm install -g firebase-tools@13.22.0

      - name: Deploy Firestore Rules and Indexes
        run: firebase deploy --only firestore:rules,firestore:indexes --project ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Deploy Storage Rules (non-blocking)
        id: storage-deploy
        continue-on-error: true
        run: firebase deploy --only storage --project ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Warn if Storage Rules deploy failed
        if: ${{ steps.storage-deploy.outcome == 'failure' }}
        run: |
          echo "::warning::Storage Rules deployment failed. The service account may lack serviceusage.services.get permission. Firestore rules and indexes were deployed successfully."
          echo "### ⚠️ Storage Rules deploy failed" >> $GITHUB_STEP_SUMMARY
          echo "The service account may lack \`serviceusage.services.get\` permission for \`firebasestorage.googleapis.com\`." >> $GITHUB_STEP_SUMMARY
          echo "Firestore rules and indexes were deployed successfully." >> $GITHUB_STEP_SUMMARY

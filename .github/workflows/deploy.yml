name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NUXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NUXT_PUBLIC_FIREBASE_API_KEY }}
  NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
  NUXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NUXT_PUBLIC_FIREBASE_PROJECT_ID }}
  NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
  NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
  NUXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NUXT_PUBLIC_FIREBASE_APP_ID }}

permissions:
  checks: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build Nuxt app
        working-directory: app
        run: npm run generate

      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Build Cloud Functions
        working-directory: functions
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
          target: ${{ secrets.FIREBASE_HOSTING_SITE }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install firebase-tools
        run: npm install -g firebase-tools@13.22.0

      - name: Set Cloud Functions secrets
        id: set-secrets
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_SENDER_NAME: ${{ secrets.GMAIL_SENDER_NAME }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set_secret() {
            local name=$1 value=$2
            if [ -z "$value" ]; then
              echo "::warning::Secret $name is not set in Repository Secrets. Skipping."
              return 0
            fi
            # Create secret if it doesn't exist, then add version
            gcloud secrets describe "$name" --project="$PROJECT_ID" >/dev/null 2>&1 \
              || gcloud secrets create "$name" --replication-policy="automatic" --project="$PROJECT_ID"
            echo -n "$value" | gcloud secrets versions add "$name" --data-file=- --project="$PROJECT_ID"
          }
          set_secret "GMAIL_USER" "$GMAIL_USER"
          set_secret "GMAIL_APP_PASSWORD" "$GMAIL_APP_PASSWORD"
          set_secret "GMAIL_SENDER_NAME" "$GMAIL_SENDER_NAME"

      - name: Deploy Cloud Functions
        id: functions-deploy
        continue-on-error: true
        run: firebase deploy --only functions --project ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Warn if Cloud Functions deploy failed
        if: ${{ steps.functions-deploy.outcome == 'failure' }}
        run: |
          echo "::warning::Cloud Functions deployment failed. Check service account roles and secret configuration."
          cat >> $GITHUB_STEP_SUMMARY <<'EOF'
          ### Cloud Functions deploy failed (non-blocking)

          Required IAM roles for the service account:
          - `roles/cloudfunctions.admin`
          - `roles/secretmanager.admin` (for managing secrets)
          - `roles/iam.serviceAccountUser`

          Required Repository Secrets:
          - `GMAIL_USER` — Gmail address for sending invitations
          - `GMAIL_APP_PASSWORD` — Gmail App Password
          - `GMAIL_SENDER_NAME` — Display name for the sender (e.g. "フリマ売上管理")
          EOF

      # Firestore rules are security-critical; failure will fail the workflow (see final step).
      # continue-on-error allows Storage deploy to run before failing.
      - name: Deploy Firestore Rules and Indexes
        id: firestore-deploy
        continue-on-error: true
        run: firebase deploy --only firestore:rules,firestore:indexes --project ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Diagnose Firestore deploy failure
        if: ${{ steps.firestore-deploy.outcome == 'failure' }}
        run: |
          echo "::error::Firestore Rules/Indexes deployment failed. The service account likely lacks required IAM roles."
          cat >> $GITHUB_STEP_SUMMARY <<'EOF'
          ### Firestore Rules/Indexes deploy failed

          The service account in `FIREBASE_SERVICE_ACCOUNT` needs additional IAM roles.

          **Option A (recommended):** `roles/firebase.admin`
          **Option B (least privilege):** `roles/firebaserules.admin` + `roles/datastore.indexAdmin`

          ```bash
          # Check current roles
          gcloud projects get-iam-policy PROJECT_ID \
            --flatten='bindings[].members' \
            --filter='bindings.members:serviceAccount:SA_EMAIL' \
            --format='table(bindings.role)'

          # Grant Firebase Admin role
          gcloud projects add-iam-policy-binding PROJECT_ID \
            --member='serviceAccount:SA_EMAIL' \
            --role='roles/firebase.admin'
          ```

          See `DEPLOY.md` for details.
          EOF

      # Storage rules are auxiliary; failure is non-blocking (warning only).
      - name: Deploy Storage Rules (non-blocking)
        id: storage-deploy
        continue-on-error: true
        run: firebase deploy --only storage --project ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Warn if Storage Rules deploy failed
        if: ${{ steps.storage-deploy.outcome == 'failure' }}
        run: |
          echo "::warning::Storage Rules deployment failed. The service account may lack required roles (firebasestorage.admin, serviceusage.serviceUsageConsumer)."
          cat >> $GITHUB_STEP_SUMMARY <<'EOF'
          ### Storage Rules deploy failed (non-blocking)

          The service account may lack `roles/firebasestorage.admin` or `roles/serviceusage.serviceUsageConsumer` (`serviceusage.services.get` permission).
          See `DEPLOY.md` for details.
          EOF

      - name: Fail if Firestore deploy failed
        if: ${{ steps.firestore-deploy.outcome == 'failure' }}
        run: exit 1

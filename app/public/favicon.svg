<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#d5f0e8"/>

  <!-- Awning pole -->
  <rect x="246" y="80" width="20" height="100" rx="4" fill="#3bbfa0"/>

  <!-- Awning -->
  <path d="M100 200 Q110 120 256 110 Q402 120 412 200 Z" fill="#e8e8e8"/>
  <path d="M100 200 Q110 120 256 110 Q402 120 412 200 Z" fill="url(#stripes)"/>
  <defs>
    <pattern id="stripes" x="0" y="0" width="60" height="200" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="30" height="200" fill="#ef4444"/>
      <rect x="30" y="0" width="30" height="200" fill="white"/>
    </pattern>
    <clipPath id="awningClip">
      <path d="M100 200 Q110 120 256 110 Q402 120 412 200 Z"/>
    </clipPath>
  </defs>
  <!-- Scalloped edge -->
  <path d="M90 200 Q115 230 140 200 Q165 230 190 200 Q215 230 240 200 Q265 230 290 200 Q315 230 340 200 Q365 230 390 200 Q415 230 422 200" fill="none" stroke="#ef4444" stroke-width="6"/>

  <!-- Counter/Table -->
  <rect x="110" y="300" width="292" height="80" rx="12" fill="#2dbf9e"/>
  <rect x="110" y="300" width="292" height="16" rx="6" fill="#26a98a"/>

  <!-- Table legs -->
  <rect x="140" y="380" width="16" height="60" rx="4" fill="#2dbf9e"/>
  <rect x="356" y="380" width="16" height="60" rx="4" fill="#2dbf9e"/>

  <!-- Products on counter -->
  <!-- Red circular item -->
  <circle cx="170" cy="282" r="28" fill="#ef4444"/>
  <circle cx="170" cy="282" r="12" fill="#dc2626"/>

  <!-- Small red circles (tomatoes/items) -->
  <circle cx="200" cy="295" r="10" fill="#ef4444"/>
  <circle cx="218" cy="290" r="8" fill="#ef4444"/>

  <!-- Tall bottle -->
  <rect x="240" y="240" width="28" height="60" rx="8" fill="#f8fafc"/>
  <rect x="244" y="232" width="20" height="14" rx="4" fill="#f8fafc"/>
  <rect x="240" y="260" width="28" height="30" rx="4" fill="#60a5fa"/>

  <!-- Yellow package -->
  <rect x="280" y="248" width="40" height="52" rx="6" fill="#fbbf24"/>
  <rect x="288" y="258" width="24" height="18" rx="3" fill="#f59e0b"/>
  <text x="300" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">n</text>

  <!-- Blue/teal item -->
  <circle cx="350" cy="278" r="22" fill="#3b82f6"/>
  <circle cx="350" cy="278" r="10" fill="#2563eb"/>

  <!-- Pink box on side -->
  <rect x="80" y="330" width="50" height="45" rx="6" fill="#fda4af"/>
  <rect x="80" y="330" width="50" height="12" rx="4" fill="#fb7185"/>
  <line x1="105" y1="342" x2="105" y2="375" stroke="#fb7185" stroke-width="2"/>
</svg>
